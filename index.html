<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Turn a GitHub user's public repositories into Markdown." />
  <title>GitHub → Markdown</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <p class="eyebrow">GitHub → Markdown</p>
      <h1>Export a GitHub profile's repositories</h1>
      <p class="subtitle">
        Enter a GitHub username to generate a Markdown summary of their public repositories.
      </p>

      <form id="github-form">
        <label for="username">GitHub username</label>
        <div class="input-row">
          <input
            id="username"
            name="username"
            type="text"
            placeholder="quangshuynh"
            autocomplete="off"
            required
          />
          <button id="generate-button" type="submit">Generate</button>
        </div>
      </form>

      <p id="status" class="status" aria-live="polite"></p>

      <section id="result-section" class="result-section" hidden>
        <div class="result-header">
          <h2>Markdown output</h2>
          <div class="actions">
            <button id="copy-button" class="secondary" type="button">Copy</button>
            <button id="download-button" class="secondary" type="button">
              Download .md
            </button>
          </div>
        </div>
        <textarea id="output" readonly spellcheck="false"></textarea>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
